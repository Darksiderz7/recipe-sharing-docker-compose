name: Recipe App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Authenticate to Google Cloud
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Google Cloud
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push backend image
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: |
          docker build -t gcr.io/${GCP_PROJECT_ID}/recipe-backend:${GITHUB_SHA} ./backend
          docker push gcr.io/${GCP_PROJECT_ID}/recipe-backend:${GITHUB_SHA}

      - name: Build and push frontend image
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: |
          docker build -t gcr.io/${GCP_PROJECT_ID}/recipe-frontend:${GITHUB_SHA} ./frontend
          docker push gcr.io/${GCP_PROJECT_ID}/recipe-frontend:${GITHUB_SHA}

      - name: Deploy backend to Cloud Run
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: |
          gcloud run deploy recipe-backend \
            --image gcr.io/${GCP_PROJECT_ID}/recipe-backend:${GITHUB_SHA} \
            --region ${GCP_REGION} \
            --platform managed \
            --allow-unauthenticated

      - name: Deploy frontend to Cloud Run
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: |
          gcloud run deploy recipe-frontend \
            --image gcr.io/${GCP_PROJECT_ID}/recipe-frontend:${GITHUB_SHA} \
            --region ${GCP_REGION} \
            --platform managed \
            --allow-unauthenticated

      - name: Get deployed URLs
        if: ${{ env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' }}
        run: |
          echo "Backend URL: $(gcloud run services describe recipe-backend --region=${GCP_REGION} --format='value(status.url)')"
          echo "Frontend URL: $(gcloud run services describe recipe-frontend --region=${GCP_REGION} --format='value(status.url)')"
