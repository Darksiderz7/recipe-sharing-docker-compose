name: Recipe App CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REPOSITORY: recipe-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || (echo "Missing GCP_PROJECT_ID secret" && exit 1)
          test -n "$GCP_REGION" || (echo "Missing GCP_REGION secret" && exit 1)
          test -n "$GCP_SA_KEY" || (echo "Missing GCP_SA_KEY secret" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        run: |
          BACKEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/recipe-backend:${GITHUB_SHA}"
          docker build -t "$BACKEND_IMAGE" ./backend
          docker push "$BACKEND_IMAGE"
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy recipe-backend \
            --image "$BACKEND_IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Read backend URL
        run: |
          BACKEND_URL="$(gcloud run services describe recipe-backend --region="$GCP_REGION" --format='value(status.url)')"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "Backend URL: $BACKEND_URL"

      - name: Build and push frontend image
        run: |
          FRONTEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/recipe-frontend:${GITHUB_SHA}"
          docker build --build-arg VITE_API_URL="$BACKEND_URL" -t "$FRONTEND_IMAGE" ./frontend
          docker push "$FRONTEND_IMAGE"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy recipe-frontend \
            --image "$FRONTEND_IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: Show deployed URLs
        run: |
          FRONTEND_URL="$(gcloud run services describe recipe-frontend --region="$GCP_REGION" --format='value(status.url)')"
          echo "Backend URL: $BACKEND_URL"
          echo "Frontend URL: $FRONTEND_URL"
